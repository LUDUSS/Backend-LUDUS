# Referencia: application.properties ya consume estas variables; Spring no lee .env automaticamente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ludus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
igdb.access-token=${IGDB_ACCESS_TOKEN:}
# Si IGDB_CLIENT_SECRET esta presente tiene prioridad; token de aplicacion sin prefijo Bearer.
