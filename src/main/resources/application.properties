spring.application.name=ludus-api

igdb.client-id=${IGDB_CLIENT_ID:}
igdb.access-token=${IGDB_ACCESS_TOKEN:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ludus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-aut=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG
igdb.client-secret=${IGDB_CLIENT_SECRET:}
